name: Build Aegisub Flatpak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Flatpak
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder

    - name: Install dependencies
      run: |
        flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak --user install -y flathub org.gnome.Sdk//48 org.gnome.Platform//48

    - name: Build Aegisub
      run: |
        flatpak-builder --user --force-clean --repo=repo build-dir org.aegisub.Aegisub.yml

    - name: Create Flatpak bundle
      run: |
        flatpak build-bundle repo aegisub.flatpak org.aegisub.Aegisub

    - name: Upload Flatpak bundle
      uses: actions/upload-artifact@v4
      with:
        name: aegisub-flatpak
        path: aegisub.flatpak
